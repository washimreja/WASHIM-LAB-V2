<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Washim Lab Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="admin.css?v=studio">
</head>
<body>
  <header class="top">
    <a href="../free/"><img src="../a/washim-lab.png" alt="" width="38" height="38"><b>Washim Lab</b></a>
    <button id="signOut" class="quiet" type="button" hidden>Sign out</button>
  </header>
  <main>
    <section id="setup" class="panel" hidden>
      <p class="eyebrow">Setup needed</p><h1>Connect Supabase</h1>
      <p>Project URL ar Publishable key <code>supabase-config.js</code>-e boshan. Tarpor <code>supabase/schema.sql</code> Supabase SQL Editor-e run korun.</p>
    </section>
    <section id="login" class="panel" hidden>
      <p class="eyebrow">Private access</p><h1>Admin login</h1>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Log in</button>
      </form>
      <p id="loginMessage" class="message" role="status"></p>
    </section>
    <div id="dashboard" hidden>
      <section id="library" aria-labelledby="libraryHeading">
        <div class="studio-heading">
          <h1 id="libraryHeading" tabindex="-1">Content studio</h1>
          <button id="newPost" class="primary" type="button">+ New post</button>
        </div>
        <div class="panel library">
          <div class="section-head"><h2>Your posts</h2><button id="refresh" class="quiet" type="button">Refresh</button></div>
          <div class="filters">
            <input id="postSearch" type="search" aria-label="Search posts" placeholder="Search by title…" autocomplete="off">
            <select id="typeFilter" aria-label="Content type filter"><option value="">All types</option><option value="pdf">PDF</option><option value="prompt">Prompt</option><option value="image">Image</option><option value="link">Link</option></select>
            <select id="statusFilter" aria-label="Publication status filter"><option value="">Any status</option><option value="published">Published</option><option value="draft">Drafts</option></select>
          </div>
          <p id="listMessage" class="message" role="status" hidden></p>
          <p id="postCount" class="list-count" role="status"></p>
          <div id="postList"></div>
          <nav id="postPages" class="pagination" aria-label="Posts pages" hidden>
            <button id="prevPage" class="quiet" type="button">Previous</button>
            <span id="pageLabel"></span>
            <button id="nextPage" class="quiet" type="button">Next</button>
          </nav>
        </div>
      </section>
      <section id="editor" class="panel editor" hidden aria-labelledby="postHeading">
        <div class="section-head">
          <h1 id="postHeading" tabindex="-1">New post</h1>
          <button id="cancelEdit" class="quiet" type="button">Back to posts</button>
        </div>
        <form id="postForm">
          <fieldset id="postFields" aria-label="Post details">
          <label>Title<input id="title" maxlength="160" required></label>
          <label>Content type<select id="kind"><option value="pdf">PDF guide</option><option value="prompt">Text prompt</option><option value="image">Image</option><option value="link">External link</option></select></label>
          <label id="bodyField">Description or prompt<textarea id="body" rows="7"></textarea></label>
          <label id="linkField" hidden>External URL<input id="externalUrl" type="url" inputmode="url"></label>
          <label id="fileField">PDF file<input id="contentFile" type="file" accept="application/pdf"></label>
          <label>Cover image <span>optional</span><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp"></label>
          <p id="coverHint" class="message" hidden></p>
          <img id="currentCover" class="current-cover" alt="Current cover" hidden>
          <div class="checks">
            <label><input id="showLatest" type="checkbox" checked> Show in Latest posts</label>
            <label id="publishChoice"><input id="publishNow" type="checkbox" checked> Publish now</label>
          </div>
          </fieldset>
          <div class="editor-actions">
            <progress id="progress" max="100" value="0" aria-label="Save progress" hidden></progress>
            <p id="postMessage" class="message" role="status" hidden></p>
            <button id="publishButton" class="primary" type="submit">Publish post</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <script type="module" src="admin.js?v=studio"></script>
</body>
</html>
